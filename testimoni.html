<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testimonials - NovaStore GTPS</title>
    <meta name="description" content="See what our customers say about NovaStore GTPS services.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- AOS Animation CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom Config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        background: '#030303',
                        surface: '#0A0A0A',
                    },
                    animation: {
                        'float-dynamic': 'floatDynamic 6s ease-in-out infinite',
                        'float-fast': 'floatDynamic 4s ease-in-out infinite reverse',
                    },
                    keyframes: {
                        floatDynamic: {
                            '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
                            '33%': { transform: 'translateY(-10px) rotate(1deg)' },
                            '66%': { transform: 'translateY(5px) rotate(-1deg)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #030303;
            color: #e2e8f0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            background-image:
                radial-gradient(circle at 15% 50%, rgba(255, 255, 255, 0.03) 0%, transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(255, 255, 255, 0.02) 0%, transparent 25%);
            background-attachment: fixed;
        }

        /* Glass Card */
        .mac-card {
            background: rgba(18, 18, 18, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            transition: all 0.5s ease;
        }

        .mac-card:hover {
            background: rgba(25, 25, 25, 0.8);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-5px);
            box-shadow: 0 15px 40px -10px rgba(0, 0, 0, 0.8);
        }

        /* Navbar */
        .mac-glass {
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Chat bubble effect for images if needed, but user said straightforward image */
        .chat-image {
            mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
        }
    </style>
</head>

<body class="antialiased font-sans selection:bg-white/30 selection:text-white">

    <!-- Navbar -->
    <nav class="fixed top-0 w-full z-50 transition-all duration-300 mac-glass" id="navbar">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <!-- Logo -->
                <a href="index.html" class="flex-shrink-0 flex items-center gap-4 cursor-pointer group">
                    <div
                        class="w-10 h-10 rounded-xl bg-gradient-to-tr from-white to-gray-400 text-black flex items-center justify-center font-bold text-xl transition-all duration-500 group-hover:rotate-180 group-hover:scale-110 shadow-[0_0_20px_rgba(255,255,255,0.2)]">
                        N
                    </div>
                    <span
                        class="font-heading font-bold text-2xl tracking-tight text-white group-hover:tracking-wide transition-all duration-300">NovaStore</span>
                </a>

                <!-- Desktop Menu -->
                <div class="hidden md:block">
                    <div class="flex items-center gap-1 p-1 rounded-full border border-white/5 bg-white/[0.03]">
                        <a href="index.html"
                            class="text-gray-400 hover:text-white hover:bg-white/10 px-6 py-2 rounded-full text-sm font-medium transition-all duration-300">Home</a>
                        <a href="testimoni.html"
                            class="text-white bg-white/10 px-6 py-2 rounded-full text-sm font-medium transition-all duration-300 shadow-[0_0_20px_rgba(255,255,255,0.1)]">Testimoni</a>
                        <a href="index.html#products"
                            class="text-gray-400 hover:text-white hover:bg-white/10 px-6 py-2 rounded-full text-sm font-medium transition-all duration-300">Products</a>
                        <a href="index.html#contact"
                            class="text-gray-400 hover:text-white hover:bg-white/10 px-6 py-2 rounded-full text-sm font-medium transition-all duration-300">Contact</a>
                    </div>
                </div>

                <!-- CTA Button -->
                <div class="hidden md:block">
                    <a href="https://t.me/novalogurl" target="_blank"
                        class="bg-white text-black hover:bg-gray-200 px-7 py-2.5 rounded-full text-sm font-bold transition-all duration-300 flex items-center gap-2 group shadow-[0_0_25px_rgba(255,255,255,0.1)] hover:shadow-[0_0_40px_rgba(255,255,255,0.4)] hover:-translate-y-0.5">
                        <span>Shop Now</span>
                        <i data-lucide="sparkles" class="w-4 h-4 group-hover:rotate-12 transition-transform"></i>
                    </a>
                </div>

                <!-- Mobile menu button -->
                <div class="-mr-2 flex md:hidden">
                    <button type="button" id="mobile-menu-btn"
                        class="inline-flex items-center justify-center p-2 rounded-lg text-gray-400 hover:text-white hover:bg-white/10 focus:outline-none transition-colors">
                        <i data-lucide="menu" class="w-6 h-6"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Menu Panel -->
        <div id="mobile-menu"
            class="hidden md:hidden mac-glass border-t border-white/5 absolute w-full left-0 top-20 shadow-2xl backdrop-blur-3xl transition-all duration-300">
            <div class="px-4 pt-4 pb-6 space-y-2">
                <a href="index.html"
                    class="block px-4 py-3 rounded-lg text-base font-medium text-gray-300 hover:text-white hover:bg-white/10 hover:pl-6 transition-all">Home</a>
                <a href="testimoni.html"
                    class="block px-4 py-3 rounded-lg text-base font-medium text-white bg-white/5 pl-6 transition-all">Testimoni</a>
                <a href="index.html#products"
                    class="block px-4 py-3 rounded-lg text-base font-medium text-gray-300 hover:text-white hover:bg-white/10 hover:pl-6 transition-all">Products</a>
                <a href="index.html#contact"
                    class="block px-4 py-3 rounded-lg text-base font-medium text-gray-300 hover:text-white hover:bg-white/10 hover:pl-6 transition-all">Contact</a>
            </div>
        </div>
    </nav>

    <!-- Header Section -->
    <header class="pt-40 pb-16 text-center px-4 relative overflow-hidden">
        <div class="max-w-4xl mx-auto relative z-10">
            <div data-aos="fade-down"
                class="inline-flex items-center justify-center gap-3 px-6 py-2 mb-8 rounded-full border border-white/10 bg-white/[0.02]">
                <span class="text-gray-300 text-xs font-bold tracking-[0.2em] uppercase">Trusted Clients</span>
            </div>
            <h1 class="text-5xl md:text-7xl font-heading font-black text-white mb-6 tracking-tight drop-shadow-2xl"
                data-aos="fade-up">
                Words from <span
                    class="text-transparent bg-clip-text bg-gradient-to-b from-white via-gray-300 to-gray-600">Community.</span>
            </h1>
            <p class="text-xl text-gray-400 max-w-2xl mx-auto" data-aos="fade-up" data-aos-delay="100">
                Join hundreds of satisfied server owners who trust NovaStore.
            </p>
        </div>
    </header>

    <!-- Testimonials Grid -->
    <section class="py-16 px-4">
        <div id="testimonial-grid" class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Dynamic Testimonials will be injected here -->
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-black pt-12 pb-8 border-t border-white/10 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-gray-500 text-sm">&copy; 2025 NovaStore GTPS. All rights reserved.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        lucide.createIcons();
        AOS.init({
            duration: 800,
            easing: 'cubic-bezier(0.16, 1, 0.3, 1)',
            once: true,
            offset: 50,
        });

        // Mobile Menu Logic
        const btn = document.getElementById('mobile-menu-btn');
        const menu = document.getElementById('mobile-menu');

        btn.addEventListener('click', () => {
            const isHidden = menu.classList.contains('hidden');
            if (isHidden) {
                menu.classList.remove('hidden');
                setTimeout(() => {
                    menu.style.opacity = '1';
                    menu.style.transform = 'translateY(0)';
                }, 10);
            } else {
                menu.style.opacity = '0';
                menu.style.transform = 'translateY(-10px)';
                setTimeout(() => {
                    menu.classList.add('hidden');
                }, 300);
            }
        });

        // Dynamic Testimonial Loader
        const grid = document.getElementById('testimonial-grid');
        let index = 1;

        function loadTestimonial() {
            const img = new Image();
            const currentId = index;
            const src = `image/testimoni${currentId}.jpg`;

            img.onload = function () {
                // Template for the testimonial card
                const card = document.createElement('div');
                card.className = "mac-card rounded-[2rem] p-6 flex flex-col items-start gap-6 group hover:border-white/20";
                card.setAttribute('data-aos', 'fade-up');
                card.setAttribute('data-aos-delay', (currentId % 2 === 0) ? '200' : '100'); // Alternate delays

                card.innerHTML = `
                    <div class="w-full rounded-2xl overflow-hidden border border-white/10 bg-black/50 relative">
                        <img src="${src}" alt="Testimony Chat ${currentId}" class="w-full h-auto object-cover hover:scale-105 transition-transform duration-700">
                    </div>
                    
                    <div class="w-full pl-2">
                        <div class="flex items-center gap-3 mb-4">
                            <span class="text-sm font-bold text-white uppercase tracking-wider bg-white/10 px-3 py-1 rounded-full border border-white/10">#Testimoni ${currentId}</span>
                            <div class="h-px bg-white/10 flex-grow"></div>
                        </div>
                        
                        <div class="space-y-2 text-gray-300 font-medium">
                            <p class="text-lg text-white font-heading">Terima kasih udah support project iini</p>
                            <div class="flex flex-col gap-1 text-sm text-gray-400">
                                <span class="flex items-center gap-2"><i data-lucide="check-circle-2" class="w-4 h-4 text-green-400"></i> Fast Setup</span>
                                <span class="flex items-center gap-2"><i data-lucide="check-circle-2" class="w-4 h-4 text-green-400"></i> Permanent access</span>
                                <span class="flex items-center gap-2"><i data-lucide="check-circle-2" class="w-4 h-4 text-green-400"></i> Full Support</span>
                            </div>
                        </div>
                    </div>
                `;

                grid.appendChild(card);

                // Re-init lucide icons for new elements
                lucide.createIcons();

                // Try next image
                index++;
                loadTestimonial();
            };

            img.onerror = function () {
                // Stop trying to load more when one fails
                console.log(`Finished loading testimonials. ${currentId - 1} found.`);
            };

            img.src = src;
        }

        // Start loading
        loadTestimonial();
    </script>
</body>

</html>
